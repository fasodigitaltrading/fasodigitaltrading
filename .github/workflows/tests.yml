name: Tests and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, dom, fileinfo, ctype, tokenizer
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: composer audit
      - run: composer test
      - run: bash -n scripts/backup-mysql.sh scripts/restore-mysql.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag nexus-global-trading:test .
